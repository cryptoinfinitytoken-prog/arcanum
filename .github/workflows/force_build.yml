name: Arcanum Ultimate Stable Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    # 1. Checkout the ROCK SOLID version (v0.18.3.3)
    - uses: actions/checkout@v4
      with:
        repository: monero-project/monero
        ref: v0.18.3.3
        submodules: recursive

    # 2. Install ALL Dependencies (Including the ones missing for static builds)
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libboost-all-dev libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline6-dev libldns-dev libexpat1-dev doxygen graphviz libpgm-dev qttools5-dev-tools libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev python3 libgtest-dev

    # 3. Modify Config Safely (Python Regex)
    # We change the Network ID and Nonce to make it unique, but keep the string safe.
    - name: Brand Arcanum
      run: |
        python3 -c '
        import re
        with open("src/cryptonote_config.h", "r") as f:
            content = f.read()
        
        # Change Name
        content = re.sub(r"CRYPTONOTE_NAME = \"monero\"", "CRYPTONOTE_NAME = \"arcanum\"", content)
        
        # Change Ports
        content = re.sub(r"P2P_DEFAULT_PORT = 18080", "P2P_DEFAULT_PORT = 19990", content)
        content = re.sub(r"RPC_DEFAULT_PORT = 18081", "RPC_DEFAULT_PORT = 19991", content)
        
        # Change Nonce (The key to a new blockchain)
        content = re.sub(r"GENESIS_NONCE = 10000", "GENESIS_NONCE = 7777", content)

        with open("src/cryptonote_config.h", "w") as f:
            f.write(content)
        '

    # 4. Compile Static Slow Mode (Prevents Memory Crash)
    - name: Compile Static
      run: make release-static -j1

    # 5. Find and Move Binaries
    - name: Locate Binaries
      run: |
        mkdir arcanum_output
        find build -name "monerod" -type f -exec cp {} arcanum_output/ \;
        find build -name "monero-wallet-cli" -type f -exec cp {} arcanum_output/ \;

    # 6. Upload Victory Package
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: arcanum-linux-x64
        path: arcanum_output/
