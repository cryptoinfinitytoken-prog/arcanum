name: Arcanum Auto-Builder

on: [workflow_dispatch]

jobs:
  build:
    # 1. Use the runner that worked for you before
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    # 2. SAFETY: Enable Swap (Prevents random crashes)
    - name: Enable Swap Memory
      run: |
        sudo fallocate -l 7G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    # 3. Checkout Code
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 4. Install Dependencies
    - name: Install Dependencies
      run: sudo apt update && sudo apt install -y build-essential cmake pkg-config libboost-all-dev libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline-dev libldns-dev libexpat1-dev doxygen graphviz libpgm-dev qttools5-dev-tools libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev python3 libgtest-dev

    # 5. Apply Identity (THE FIX)
    # Instead of pasting the long broken string, we just change the Nonce.
    # This creates a unique coin WITHOUT causing the "Parse Error".
    - name: Apply Arcanum Identity
      run: |
        # Change Name
        sed -i 's/CRYPTONOTE_NAME = "monero"/CRYPTONOTE_NAME = "arcanum"/g' src/cryptonote_config.h
        
        # Change Ports
        sed -i 's/P2P_DEFAULT_PORT = 18080/P2P_DEFAULT_PORT = 19990/g' src/cryptonote_config.h
        sed -i 's/RPC_DEFAULT_PORT = 18081/RPC_DEFAULT_PORT = 19991/g' src/cryptonote_config.h
        
        # Change Nonce (This creates the unique Mainnet)
        sed -i 's/GENESIS_NONCE = 10000/GENESIS_NONCE = 7777/g' src/cryptonote_config.h

    # 6. Compile STATIC (THE FIX for Chromebook)
    # We added 'release-static' so it runs on your laptop without errors.
    - name: Compile Arcanum
      run: make release-static -j2

    # 7. Upload (Using your working wildcard path)
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: arcanum-linux-x64
        path: build/**/bin/*
