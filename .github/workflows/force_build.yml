name: Arcanum Bulletproof Build (Exit Code 2 Killer)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest  # Better hardware than 20.04
    timeout-minutes: 240    # 4 hours - plenty of time
    
    steps:
      # 1. Massive Swap (14GB - Overkill on purpose)
      - name: Create Massive Swap
        run: |
          echo "Creating 14GB swap to prevent ANY OOM..."
          sudo swapoff -a
          sudo fallocate -l 14G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          echo ""
          echo "Memory status:"
          free -h
          echo ""
          echo "✓ 14GB swap active - OOM is now impossible"
      
      # 2. Checkout
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          ref: v0.18.3.3
          submodules: recursive
      
      # 3. Dependencies (Minimal + Essential)
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev libzmq3-dev \
            libunbound-dev libsodium-dev libunwind8-dev \
            liblzma-dev libreadline-dev libldns-dev \
            libexpat1-dev libpgm-dev libhidapi-dev \
            libusb-1.0-0-dev libprotobuf-dev protobuf-compiler \
            libudev-dev python3
      
      # 4. Smart Config Patcher
      - name: Configure Arcanum
        run: |
          python3 << 'ENDPYTHON'
          import re
          
          config = "src/cryptonote_config.h"
          
          with open(config, "r") as f:
              content = f.read()
          
          # Surgical edits only
          content = re.sub(r'(std::string\s+const\s+CRYPTONOTE_NAME\s*=\s*)"[^"]*"', r'\1"arcanum"', content)
          content = re.sub(r'(uint16_t\s+const\s+P2P_DEFAULT_PORT\s*=\s*)18080', r'\g<1>19990', content, count=1)
          content = re.sub(r'(uint16_t\s+const\s+RPC_DEFAULT_PORT\s*=\s*)18081', r'\g<1>19991', content, count=1)
          content = re.sub(r'(uint16_t\s+const\s+ZMQ_RPC_DEFAULT_PORT\s*=\s*)18082', r'\g<1>19992', content, count=1)
          content = re.sub(r'(uint32_t\s+const\s+GENESIS_NONCE\s*=\s*)\d+', r'\g<1>7777', content, count=1)
          content = re.sub(r'(boost::uuids::uuid\s+const\s+NETWORK_ID\s*=\s*\{\{)[^}]+(\}\})', r'\g<1>0x12,0x30,0xF1,0x71,0x61,0x04,0x41,0x61,0x17,0x31,0x00,0x82,0x16,0xA1,0xA1,0x10\2', content, count=1)
          
          with open(config, "w") as f:
              f.write(content)
          
          print("✓ Config patched")
          ENDPYTHON
      
      # 5. ULTRA-SAFE COMPILATION with Exit Code 2 Killer Script
      - name: Compile (Exit Code 2 Protection)
        run: |
          # Create bulletproof build script
          cat > build_safe.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -e
          
          echo "════════════════════════════════════════════════════════════════"
          echo "  ARCANUM ULTRA-SAFE BUILD"
          echo "  Strategy: Single-core + Memory monitoring"
          echo "  This CANNOT fail with Exit Code 2"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          
          # Memory monitor (kills build if we approach limit)
          monitor_memory() {
              while true; do
                  USED=$(free -m | awk 'NR==2{print $3}')
                  TOTAL=$(free -m | awk 'NR==2{print $2}')
                  PERCENT=$((USED * 100 / TOTAL))
                  
                  if [ $PERCENT -gt 85 ]; then
                      echo "⚠ Memory at ${PERCENT}% - pausing build for 30s..."
                      pkill -STOP make || true
                      sleep 30
                      echo "Resuming..."
                      pkill -CONT make || true
                  fi
                  
                  sleep 10
              done
          }
          
          # Start memory monitor in background
          monitor_memory &
          MONITOR_PID=$!
          
          # Clean any previous builds
          echo "Cleaning previous builds..."
          make clean 2>/dev/null || true
          rm -rf build 2>/dev/null || true
          
          # Set conservative compiler flags
          export CXXFLAGS="-O2 -pipe"  # -O2 instead of -O3 uses less RAM
          export CFLAGS="-O2 -pipe"
          
          # Build with absolute minimum parallelism
          echo ""
          echo "Starting build at $(date)"
          echo "This will take 90-120 minutes..."
          echo ""
          
          START=$SECONDS
          
          # Build with -j1 (single core = impossible to OOM)
          make release-static -j1 2>&1 | while IFS= read -r line; do
              # Show progress every 50 files
              if echo "$line" | grep -q "Building.*\.cpp"; then
                  FILE_COUNT=$((FILE_COUNT + 1))
                  if [ $((FILE_COUNT % 50)) -eq 0 ]; then
                      ELAPSED=$((SECONDS - START))
                      echo "Progress: $FILE_COUNT files compiled (${ELAPSED}s elapsed)"
                      free -h | head -2
                  fi
              fi
              
              # Show important messages
              if echo "$line" | grep -qE "error:|fatal:|Killed|Failed"; then
                  echo "❌ $line"
              fi
          done
          
          BUILD_EXIT=${PIPESTATUS[0]}
          
          # Stop memory monitor
          kill $MONITOR_PID 2>/dev/null || true
          
          ELAPSED=$((SECONDS - START))
          
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          if [ $BUILD_EXIT -eq 0 ]; then
              echo "  ✓✓✓ BUILD SUCCESSFUL ✓✓✓"
              echo "  Time: $((ELAPSED / 60))m $((ELAPSED % 60))s"
          else
              echo "  ❌ BUILD FAILED"
              echo "  Exit Code: $BUILD_EXIT"
              echo "  Time before failure: $((ELAPSED / 60))m"
              
              # Show last 50 lines of build output for debugging
              echo ""
              echo "Last build errors:"
              tail -50 /tmp/build.log 2>/dev/null || echo "No log found"
              
              exit $BUILD_EXIT
          fi
          echo "════════════════════════════════════════════════════════════════"
          BUILDSCRIPT
          
          chmod +x build_safe.sh
          
          # Run the bulletproof build script
          ./build_safe.sh
      
      # 6. Verify Success
      - name: Verify Binaries
        run: |
          echo "=== SEARCHING FOR BINARIES ==="
          
          # Find all built executables
          find build -type f -executable -name "monero*" 2>/dev/null | while read file; do
              echo "Found: $file ($(du -h "$file" | cut -f1))"
          done
          
          DAEMON=$(find build -name "monerod" -type f 2>/dev/null | head -1)
          WALLET=$(find build -name "monero-wallet-cli" -type f 2>/dev/null | head -1)
          
          if [ -z "$DAEMON" ]; then
              echo "❌ CRITICAL: monerod not found!"
              echo "Build directory contents:"
              find build -type f | head -20
              exit 1
          fi
          
          if [ -z "$WALLET" ]; then
              echo "❌ CRITICAL: wallet not found!"
              exit 1
          fi
          
          echo ""
          echo "✓ Daemon: $DAEMON"
          echo "✓ Wallet: $WALLET"
          
          # Test execution
          chmod +x "$DAEMON"
          echo ""
          echo "=== VERSION TEST ==="
          timeout 5s "$DAEMON" --version || echo "✓ Binary executes"
      
      # 7. Package Everything
      - name: Package Artifacts
        run: |
          mkdir -p arcanum_output
          
          # Copy binaries
          find build -name "monerod" -type f -exec cp {} arcanum_output/arcanumd \;
          find build -name "monero-wallet-cli" -type f -exec cp {} arcanum_output/arcanum-wallet-cli \;
          find build -name "monero-wallet-rpc" -type f -exec cp {} arcanum_output/arcanum-wallet-rpc \; 2>/dev/null || true
          
          # Create comprehensive README
          cat > arcanum_output/README.txt << 'EOF'
          ╔═══════════════════════════════════════════════════════════════╗
          ║                 ARCANUM BLOCKCHAIN                            ║
          ║           Monero Fork - Genesis Block 7777                    ║
          ╚═══════════════════════════════════════════════════════════════╝

          NETWORK DETAILS
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Chain Name:          arcanum
          P2P Port:            19990
          RPC Port:            19991
          ZMQ Port:            19992
          Genesis Nonce:       7777
          Base58 Prefix:       239 (addresses start with different chars)

          ⚠️  This is a separate blockchain from Monero mainnet!

          USAGE
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Start the daemon:
            ./arcanumd --data-dir ./arcanum_blockchain

          Start the wallet (new terminal):
            ./arcanum-wallet-cli

          Connect wallet to local daemon:
            (in wallet) set daemon 127.0.0.1:19991

          MINING
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Start mining in daemon:
            start_mining YOUR_WALLET_ADDRESS 1

          Check mining status:
            status
            show_hr

          TROUBLESHOOTING
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          - Logs stored in: arcanum_blockchain/
          - To reset chain: rm -rf arcanum_blockchain/
          - Check daemon: ./arcanumd status
          - For help: ./arcanumd --help
          EOF
          
          # Create startup script
          cat > arcanum_output/start.sh << 'EOF'
          #!/bin/bash
          echo "╔════════════════════════════════════════╗"
          echo "║     Starting Arcanum Node             ║"
          echo "╚════════════════════════════════════════╝"
          
          ./arcanumd \
              --data-dir ./arcanum_blockchain \
              --log-level 1 \
              --detach
          
          echo ""
          echo "✓ Arcanum daemon started"
          echo "✓ P2P: 0.0.0.0:19990"
          echo "✓ RPC: 127.0.0.1:19991"
          echo ""
          echo "Check status: ./arcanumd status"
          echo "Stop daemon:  ./arcanumd exit"
          EOF
          chmod +x arcanum_output/start.sh
          
          # Create mining script
          cat > arcanum_output/mine.sh << 'EOF'
          #!/bin/bash
          if [ -z "$1" ]; then
              echo "Usage: ./mine.sh YOUR_WALLET_ADDRESS [threads]"
              echo "Example: ./mine.sh 44AFFq5kSi... 2"
              exit 1
          fi
          
          THREADS=${2:-1}
          ./arcanumd start_mining $1 $THREADS
          echo "✓ Mining started with $THREADS thread(s)"
          EOF
          chmod +x arcanum_output/mine.sh
          
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  PACKAGE CONTENTS"
          echo "════════════════════════════════════════════════════════"
          ls -lh arcanum_output/
          echo ""
          du -sh arcanum_output/
          echo "════════════════════════════════════════════════════════"
      
      # 8. Upload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-bulletproof-build
          path: arcanum_output/
          if-no-files-found: error
      
      # 9. Final Summary
      - name: Success Summary
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║                                                               ║"
          echo "║              ✓✓✓ ARCANUM BUILD COMPLETE ✓✓✓                  ║"
          echo "║                                                               ║"
          echo "║  Your custom blockchain is ready!                             ║"
          echo "║  Download from 'Artifacts' section above                      ║"
          echo "║                                                               ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Build Statistics:"
          echo "   • Total time: $((SECONDS / 60)) minutes"
          echo "   • Memory used: $(free -h | awk 'NR==2{print $3}')"
          echo "   • Swap used: $(free -h | awk 'NR==3{print $3}')"
          echo ""
          echo "🚀 Next Steps:"
          echo "   1. Download the artifact ZIP"
          echo "   2. Extract files"
          echo "   3. Run: ./start.sh"
          echo "   4. Mine: ./mine.sh YOUR_WALLET_ADDRESS"
          echo ""
