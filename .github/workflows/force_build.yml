name: Arcanum Hardened Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 1 hour 30mins max
    
    steps:
      # 1. Checkout Official Monero v0.18.3.3
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          ref: v0.18.3.3
          submodules: recursive
      
      # 2. Verify Checkout Success
      - name: Verify Source Code
        run: |
          if [ ! -f "src/cryptonote_config.h" ]; then
            echo "❌ ERROR: cryptonote_config.h not found!"
            exit 1
          fi
          echo "✓ Source code verified"
          echo "Original config size: $(wc -l < src/cryptonote_config.h) lines"
      
      # 3. Install ALL Dependencies
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev libzmq3-dev \
            libunbound-dev libsodium-dev libunwind8-dev \
            liblzma-dev libreadline6-dev libldns-dev \
            libexpat1-dev doxygen graphviz libpgm-dev \
            qttools5-dev-tools libhidapi-dev libusb-1.0-0-dev \
            libprotobuf-dev protobuf-compiler libudev-dev \
            python3 libgtest-dev
          echo "✓ Dependencies installed"
      
      # 4. Surgical Config Modification (PRESERVES EVERYTHING)
      - name: Brand as Arcanum
        run: |
          python3 << 'ENDPYTHON'
          import sys
          import re
          
          config_path = "src/cryptonote_config.h"
          backup_path = "src/cryptonote_config.h.backup"
          
          print("=" * 60)
          print("ARCANUM CONFIG PATCHER")
          print("=" * 60)
          
          # Read entire file
          with open(config_path, "r") as f:
              content = f.read()
          
          # Create backup
          with open(backup_path, "w") as f:
              f.write(content)
          print("✓ Backup created")
          
          original_content = content
          changes_made = []
          
          # 1. Change CRYPTONOTE_NAME (matches any whitespace/formatting)
          pattern1 = r'(std::string\s+const\s+CRYPTONOTE_NAME\s*=\s*)"[^"]*"'
          if re.search(pattern1, content):
              content = re.sub(pattern1, r'\1"arcanum"', content)
              changes_made.append("CRYPTONOTE_NAME → 'arcanum'")
          else:
              print("⚠ WARNING: CRYPTONOTE_NAME pattern not found")
          
          # 2. Change mainnet P2P Port
          pattern2 = r'(uint16_t\s+const\s+P2P_DEFAULT_PORT\s*=\s*)\d+(\s*;)'
          matches = list(re.finditer(pattern2, content))
          if len(matches) > 0:
              # Replace first occurrence (mainnet)
              content = re.sub(pattern2, r'\g<1>19990\2', content, count=1)
              changes_made.append("P2P_DEFAULT_PORT → 19990")
          else:
              print("⚠ WARNING: P2P_DEFAULT_PORT pattern not found")
          
          # 3. Change mainnet RPC Port  
          pattern3 = r'(uint16_t\s+const\s+RPC_DEFAULT_PORT\s*=\s*)\d+(\s*;)'
          matches = list(re.finditer(pattern3, content))
          if len(matches) > 0:
              # Replace first occurrence (mainnet)
              content = re.sub(pattern3, r'\g<1>19991\2', content, count=1)
              changes_made.append("RPC_DEFAULT_PORT → 19991")
          else:
              print("⚠ WARNING: RPC_DEFAULT_PORT pattern not found")
          
          # 4. Change mainnet ZMQ Port (if exists)
          pattern4 = r'(uint16_t\s+const\s+ZMQ_RPC_DEFAULT_PORT\s*=\s*)\d+(\s*;)'
          matches = list(re.finditer(pattern4, content))
          if len(matches) > 0:
              content = re.sub(pattern4, r'\g<1>19992\2', content, count=1)
              changes_made.append("ZMQ_RPC_DEFAULT_PORT → 19992")
          
          # 5. Change Genesis Nonce (mainnet only)
          pattern5 = r'(uint32_t\s+const\s+GENESIS_NONCE\s*=\s*)\d+(\s*;)'
          matches = list(re.finditer(pattern5, content))
          if len(matches) > 0:
              # Replace first occurrence (mainnet)
              content = re.sub(pattern5, r'\g<1>7777\2', content, count=1)
              changes_made.append("GENESIS_NONCE → 7777")
          else:
              print("⚠ WARNING: GENESIS_NONCE pattern not found")
          
          # 6. Change Network ID (mainnet only - first occurrence)
          pattern6 = r'(boost::uuids::uuid\s+const\s+NETWORK_ID\s*=\s*\{\{)[^}]+(\}\}\s*;)'
          matches = list(re.finditer(pattern6, content))
          if len(matches) > 0:
              new_uuid = "0x12,0x30,0xF1,0x71,0x61,0x04,0x41,0x61,0x17,0x31,0x00,0x82,0x16,0xA1,0xA1,0x10"
              content = re.sub(pattern6, r'\g<1>' + new_uuid + r'\2', content, count=1)
              changes_made.append("NETWORK_ID → custom UUID")
          
          # Write modified content
          with open(config_path, "w") as f:
              f.write(content)
          
          # Verify file is still valid
          if len(content) < len(original_content) * 0.8:
              print("❌ ERROR: Modified file too small! Restoring backup.")
              with open(backup_path, "r") as f:
                  content = f.read()
              with open(config_path, "w") as f:
                  f.write(content)
              sys.exit(1)
          
          print(f"✓ Modified config size: {len(content.splitlines())} lines")
          print(f"✓ Changes applied: {len(changes_made)}")
          
          # Show what changed
          print("\n" + "=" * 60)
          print("CHANGES APPLIED:")
          print("=" * 60)
          for change in changes_made:
              print(f"  ✓ {change}")
          
          if len(changes_made) < 4:
              print("\n⚠ WARNING: Expected 5-6 changes, only made", len(changes_made))
              print("Build may work but network identity might not be unique.")
          
          print("=" * 60)
          ENDPYTHON
      
      # 5. Verify Patches (Show Actual Values)
      - name: Verify Configuration
        run: |
          echo "=== VERIFICATION: Checking modified values ==="
          echo ""
          echo "Network Name:"
          grep -A 1 "CRYPTONOTE_NAME" src/cryptonote_config.h | head -3
          echo ""
          echo "Mainnet Ports:"
          grep "P2P_DEFAULT_PORT\|RPC_DEFAULT_PORT\|ZMQ_RPC_DEFAULT_PORT" src/cryptonote_config.h | head -5
          echo ""
          echo "Genesis Nonce:"
          grep "GENESIS_NONCE" src/cryptonote_config.h | head -2
          echo ""
          echo "✓ Configuration verified"
      
      # 6. Compile Static (Single Core = No OOM)
      - name: Build Static Binaries
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  STARTING STATIC BUILD (45-90 minutes)"
          echo "  Using -j1 to prevent out-of-memory errors"
          echo "════════════════════════════════════════════════════════"
          
          START_TIME=$SECONDS
          make release-static -j1
          BUILD_EXIT=$?
          ELAPSED=$((SECONDS - START_TIME))
          
          echo ""
          echo "════════════════════════════════════════════════════════"
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "  ✓ BUILD SUCCESSFUL"
            echo "  Time: $((ELAPSED / 60)) minutes $((ELAPSED % 60)) seconds"
          else
            echo "  ❌ BUILD FAILED (Exit Code: $BUILD_EXIT)"
            echo "  Time before failure: $((ELAPSED / 60)) minutes"
            exit 1
          fi
          echo "════════════════════════════════════════════════════════"
      
      # 7. Verify Binaries Exist and Work
      - name: Verify Build Output
        run: |
          echo "=== BINARY VERIFICATION ==="
          
          # Find binaries
          MONEROD=$(find build -name "monerod" -type f 2>/dev/null | head -1)
          WALLET=$(find build -name "monero-wallet-cli" -type f 2>/dev/null | head -1)
          WALLET_RPC=$(find build -name "monero-wallet-rpc" -type f 2>/dev/null | head -1)
          
          # Check daemon
          if [ -z "$MONEROD" ]; then
            echo "❌ ERROR: monerod binary not found!"
            find build -type f -name "monero*" || echo "No binaries found at all!"
            exit 1
          fi
          echo "✓ Found daemon: $MONEROD"
          
          # Check wallet
          if [ -z "$WALLET" ]; then
            echo "❌ ERROR: monero-wallet-cli binary not found!"
            exit 1
          fi
          echo "✓ Found wallet: $WALLET"
          
          # Check RPC (optional)
          if [ -n "$WALLET_RPC" ]; then
            echo "✓ Found wallet RPC: $WALLET_RPC"
          fi
          
          # Make executable
          chmod +x "$MONEROD" "$WALLET"
          [ -n "$WALLET_RPC" ] && chmod +x "$WALLET_RPC"
          
          # Test version output
          echo ""
          echo "=== VERSION CHECK ==="
          "$MONEROD" --version 2>&1 | head -5 || echo "⚠ Version check failed (might be OK)"
          
          echo ""
          echo "✓ All binaries verified"
      
      # 8. Package Everything
      - name: Prepare Artifacts
        run: |
          mkdir -p arcanum_output
          
          # Copy and rename binaries
          find build -name "monerod" -type f -exec cp {} arcanum_output/arcanumd \;
          find build -name "monero-wallet-cli" -type f -exec cp {} arcanum_output/arcanum-wallet-cli \;
          find build -name "monero-wallet-rpc" -type f -exec cp {} arcanum_output/arcanum-wallet-rpc \; 2>/dev/null || true
          
          # Create comprehensive README
          cat > arcanum_output/README.txt << 'EOF'
          ╔════════════════════════════════════════════════════════╗
          ║           ARCANUM - Custom Monero Fork                 ║
          ║              Built from Monero v0.18.3.3               ║
          ╚════════════════════════════════════════════════════════╝

          NETWORK CONFIGURATION:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Network Name:     arcanum
          P2P Port:         19990
          RPC Port:         19991  
          ZMQ Port:         19992
          Genesis Nonce:    7777

          ⚠️  WARNING: This is a CUSTOM FORK - Do NOT use on Monero mainnet!

          QUICK START:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          1. Start the daemon:
             ./arcanumd --data-dir ./arcanum_data

          2. Start the wallet:
             ./arcanum-wallet-cli

          3. Connect wallet to daemon:
             In wallet: set daemon 127.0.0.1:19991

          ADDITIONAL INFO:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          - Binaries are statically linked (no external dependencies)
          - Built on Ubuntu 20.04
          - Full Monero consensus rules preserved
          - Only network identity & ports modified

          For issues: Check logs in arcanum_data/ directory
          EOF
          
          # Create launch script
          cat > arcanum_output/start_node.sh << 'EOF'
          #!/bin/bash
          echo "Starting Arcanum Node..."
          ./arcanumd --data-dir ./arcanum_data --detach
          echo "Node started. Check status with: ./arcanumd status"
          EOF
          chmod +x arcanum_output/start_node.sh
          
          # List contents with sizes
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ARTIFACT CONTENTS"
          echo "════════════════════════════════════════════════════════"
          ls -lh arcanum_output/
          echo "════════════════════════════════════════════════════════"
      
      # 9. Upload Victory Package
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-linux-x64-static
          path: arcanum_output/
          if-no-files-found: error
      
      # 10. Success Summary
      - name: Build Complete
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                                                        ║"
          echo "║          ✓ ARCANUM BUILD SUCCESSFUL ✓                 ║"
          echo "║                                                        ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Download your binaries from the 'Artifacts' section"
          echo "⏱️  Total build time: $((SECONDS / 60)) minutes"
          echo ""
          echo "Next steps:"
          echo "  1. Download artifact ZIP"
          echo "  2. Extract files"  
          echo "  3. Run: ./arcanumd --data-dir ./arcanum_data"
          echo ""
