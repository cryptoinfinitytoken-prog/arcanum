name: Arcanum Time Capsule Build

on: [workflow_dispatch]

jobs:
  build:
    # 1. Use Fastest Available Hardware
    runs-on: ubuntu-latest
    
    # 2. CRITICAL: Run inside an OLD Linux container (Fixes OpenSSL Error)
    container:
      image: ubuntu:20.04
      options: --privileged

    timeout-minutes: 180
    
    steps:
    # 3. Setup the Container Environment
    - name: Prepare Container
      run: |
        # Disable timezone prompts
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        # Install basics needed for GitHub Actions to work
        apt-get install -y git sudo curl tar unzip

    # 4. Checkout Official Monero
    - uses: actions/checkout@v4
      with:
        repository: monero-project/monero
        ref: v0.18.3.3
        submodules: recursive

    # 5. Install Dependencies (For Ubuntu 20.04)
    - name: Install Build Tools
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libboost-all-dev libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline-dev libldns-dev libexpat1-dev doxygen graphviz libpgm-dev qttools5-dev-tools libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev python3 libgtest-dev

    # 6. Apply Arcanum Identity (Safe Python Method)
    - name: Brand Arcanum
      run: |
        python3 -c '
        import sys
        import re
        
        config_path = "src/cryptonote_config.h"
        
        with open(config_path, "r") as f:
            content = f.read()
            
        # 1. Change Name
        content = re.sub(r"CRYPTONOTE_NAME = \"monero\"", "CRYPTONOTE_NAME = \"arcanum\"", content)
        
        # 2. Change Ports (18080 -> 19990)
        content = content.replace("18080", "19990")
        content = content.replace("18081", "19991")
        
        # 3. Change Nonce (Unique Chain)
        content = content.replace("GENESIS_NONCE = 10000", "GENESIS_NONCE = 7777")
        
        with open(config_path, "w") as f:
            f.write(content)
        
        print("✓ Configuration Patched")
        '

    # 7. Compile Static (Safe -j2)
    # We use -j2 because we don't have Swap in a container, but 20.04 uses less RAM.
    - name: Compile Static
      run: make release-static -j2

    # 8. Find and Rescue Binaries
    - name: Locate Binaries
      run: |
        mkdir arcanum_output
        find build -name "monerod" -type f -exec cp {} arcanum_output/arcanumd \;
        find build -name "monero-wallet-cli" -type f -exec cp {} arcanum_output/arcanum-wallet-cli \;

    # 9. Upload
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: arcanum-linux-x64-static
        path: arcanum_output/
